# /etc/logrotate.d/lfm3-npu
# Log rotation for LFM3-1.7B inference server logs.
# Copy to /etc/logrotate.d/lfm3-npu (requires root) or run manually:
#   logrotate -f /etc/logrotate.d/lfm3-npu

/media/scott/data/lfm3-npu-tool/var/log/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 scott scott
    sharedscripts
    postrotate
        # Servers write to file handles directly; no signal needed
        # (they use nohup with file redirection, not syslog)
        true
    endscript
}

/media/scott/data/lfm3-npu-tool/var/log/watchdog-cron.log
/media/scott/data/lfm3-npu-tool/var/log/doctor-cron.log
/media/scott/data/lfm3-npu-tool/var/log/boot-start.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    create 644 scott scott
}
