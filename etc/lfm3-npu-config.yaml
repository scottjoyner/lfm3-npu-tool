# LFM3-1.7B NPU Inference Tooling Configuration
# Copy this file to ~/.config/lfm3-npu/config.yaml to customize

# =============================================================================
# Model Configuration
# =============================================================================
model:
  path: /media/scott/data/lfm3_conv_centertap.onnx
  tokenizer: /media/scott/data/lfm3_oga_export/tokenizer.json
  type: lfm3-1.7b-npu

# =============================================================================
# NPU Configuration (VitisAI ExecutionProvider)
# =============================================================================
npu:
  provider: VitisAIExecutionProvider
  device_index: 0
  custom_ops_lib: /media/scott/data/ryzen-ai-venv/lib/python3.12/site-packages/voe/lib/libonnxruntime_vitis_ai_custom_ops.so
  python_executable: /media/scott/data/ryzen-ai-venv/bin/python
  ld_library_path:
    - /media/scott/data/ryzen-ai-venv/lib/python3.12/site-packages/flexml/flexml_extras/lib
    - /media/scott/data/ryzen-ai-venv/lib/python3.12/site-packages/voe/lib
    - /opt/xilinx/xrt/lib

# =============================================================================
# Server Configuration
# =============================================================================
server:
  cpu:
    port: 1238
    host: 0.0.0.0
    model_path: /media/scott/data/lfm3_oga_export/model.onnx
    kv_quant_model_path: /media/scott/data/lfm3_oga_export/model_kv_quant.onnx
    use_kv_quant: false
    model_type: cpu_onnx

  npu:
    port: 1239
    host: 0.0.0.0
    model_path: /media/scott/data/lfm3_oga_export/model.onnx
    model_type: npu_ryzenai

# =============================================================================
# Generation Defaults
# =============================================================================
generation:
  max_tokens: 50
  temperature: 0.7
  top_p: 0.9
  do_sample: true

# =============================================================================
# Logging
# =============================================================================
logging:
  level: INFO
  log_dir: /media/scott/data/lfm3-npu-tool/var/log

# =============================================================================
# Model Promotion (CI/CD Pipeline)
# =============================================================================
model_promotion:
  storage_path: /media/scott/data/lfm3-npu-tool/var/promotion.json
  auto_approve: false
  stages:
    - staging
    - canary
    - production

# =============================================================================
# Disaster Recovery
# =============================================================================
disaster_recovery:
  storage_path: /media/scott/data/lfm3-npu-tool/var/dr.json
  regions:
    - name: primary
      status: primary
      endpoint: http://localhost:1239
    - name: secondary
      status: secondary
      endpoint: http://localhost:1240

# =============================================================================
# Auto-Scaling
# =============================================================================
auto_scaling:
  storage_path: /media/scott/data/lfm3-npu-tool/var/autoscaler.json
  min_replicas: 1
  max_replicas: 10
  target_cpu_percent: 70.0
  target_memory_percent: 80.0
  target_queue_depth: 10
  target_latency_p95_ms: 1000.0
  max_error_rate: 0.05
  scale_up_cooldown_seconds: 60
  scale_down_cooldown_seconds: 300
  evaluation_interval_seconds: 30

# =============================================================================
# A/B Testing
# =============================================================================
ab_testing:
  storage_path: /media/scott/data/lfm3-npu-tool/var/ab_tests.json

# =============================================================================
# Cost Tracking
# =============================================================================
cost_tracking:
  storage_path: /media/scott/data/lfm3-npu-tool/var/cost_tracking.json
  default_tier: standard
  pricing_tiers:
    standard:
      cost_per_1k_tokens: 0.001
    premium:
      cost_per_1k_tokens: 0.002

# =============================================================================
# Alerting
# =============================================================================
alerting:
  storage_path: /media/scott/data/lfm3-npu-tool/var/alerts.json
  webhook_url: ""
  slack_webhook: ""
  pagerduty_key: ""
  severity_levels:
    - info
    - warning
    - critical

# =============================================================================
# Security Scanning
# =============================================================================
security_scan:
  storage_path: /media/scott/data/lfm3-npu-tool/var/security_scan.json
  scan_paths:
    - lib/lfm3_npu/
    - bin/
    - scripts/
  exclude_paths:
    - .git/
    - __pycache__/
    - .pytest_cache/

# =============================================================================
# API Key Rotation
# =============================================================================
key_rotation:
  storage_path: /media/scott/data/lfm3-npu-tool/var/key_rotation.json
  policies:
    - name: age_based
      max_age_days: 90
    - name: usage_based
      max_usage_count: 10000
    - name: cost_based
      max_cost_usd: 100.0