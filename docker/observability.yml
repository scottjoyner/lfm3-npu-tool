# Observability stack for LFM3-1.7B inference
# Jaeger + OpenTelemetry Collector
#
# Usage:
#   docker-compose -f docker/observability.yml up -d
#
# Then set:
#   export LFM3_TRACING_ENABLED=true
#   export LFM3_OTLP_ENDPOINT=http://localhost:4318
#
# Access Jaeger UI at http://localhost:16686

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # Jaeger UI
      - "14250:14250"   # OTLP gRPC
      - "14268:14268"   # Jaeger agent (thrift)
      - "14269:14269"   # Jaeger agent (HTTP)
      - "9411:9411"     # Zipkin compatible
      - "14318:4318"    # OTLP HTTP
      - "14318:4318"    # OTLP HTTP

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    depends_on:
      - jaeger
