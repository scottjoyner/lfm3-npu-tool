# Prometheus scrape config for LFM3-1.7B inference servers
# Scrapes the NPU metrics exporter running on the host

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'lfm3-inference'
    static_configs:
      - targets: ['host.docker.internal:9190']
        labels:
          server: 'npu-metrics'
          provider: 'fastflowlm'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml
