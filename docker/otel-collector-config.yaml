# OpenTelemetry Collector config for LFM3-1.7B inference tracing
# Receives OTLP traces from CPU and NPU servers, exports to Jaeger

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  otlp:
    # Jaeger's OTLP HTTP receiver expects /api/otlp/v1/traces. The OTel
    # exporter appends "/v1/traces" to the endpoint, so we include the
    # "/api/otlp" prefix here to produce /api/otlp/v1/traces.
    endpoint: jaeger:4318/api/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp]